version: 2
mode: read-only
profile: chatgptWebDefault

profiles:
  chatgptWebDefault:
    limits:
      output:
        preferredToolOutputBytes: 12000
        maxToolOutputBytes: 60000
      http:
        oauthMaxBodyBytes: 1048576
        mcpMaxBodyBytes: 16777216
      tree:
        defaultMaxEntries: 300
        maxEntries: 5000
        maxDepth: 12
      search:
        engine: rg
        defaultMaxResults: 80
        maxResults: 1000
        maxColumns: 300
        maxContextLines: 5
        maxScannedBytesPerFile: null
      read:
        defaultMaxBytes: 12000
        maxBytes: 131072
        maxReadManyFiles: 50
      change:
        maxFiles: 1000
        defaultMaxFiles: 200
        maxTotalBytes: 16777216
        maxTextFileBytes: 2097152
        maxInlineDiffBytes: 12288
        maxInlineDiffLines: 200
      task:
        defaultTimeoutSeconds: 300
        maxTimeoutSeconds: 3600
        outputHeadBytes: 12000
        outputTailBytes: 12000
      manual:
        ttlSeconds: 86400
        manualMessageMaxBytes: 65536
      rate:
        maxCallsPerMinute: 120

workspace:
  root: "${workspaceRoot}"
  protected:
    - ".git/**"
    - ".env"
    - "**/.env"
    - "**/*.pem"
    - "**/id_rsa"
    - "**/id_ed25519"
    - "node_modules/**"
    - "dist/**"
    - "build/**"

taskBundles:
  node:
    packageManagers: [npm, pnpm, yarn, bun]
    scripts: [test, lint, typecheck, build, format]
    allowInstall: false
  go:
    tasks: [test_all, vet, fmt, mod_download, mod_tidy]
  rust:
    tasks: [test, check, clippy, fmt, build, fetch]
  flutter:
    tasks: [pub_get, analyze, test, dart_format]
  frontend:
    tasks: [playwright_test, cypress_run, vitest, jest, eslint, biome, prettier, tsc_noemit]
  codegen:
    tasks: [openapi_generate, prisma_generate, drizzle_generate, sqlc_generate, buf_lint, buf_generate]
  project:
    taskFiles: [make, just, task]
    allowedTargets: []

upstreams: {}

tools:
  - name: workspace.context
    type: builtIn
    description: Preflight context for ChatGPT Web coding. Call before workspace tools.
    inputSchema: &emptyInputSchema
      type: object
      additionalProperties: false
    outputSchema: &genericObjectOutputSchema
      type: object
      additionalProperties: true
    annotations: &readOnlyAnnotations
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false

  - name: workspace.scan
    type: builtIn
    description: Deep workspace scan for project manifests, languages, tools, task files, and codegen.
    inputSchema:
      type: object
      properties:
        maxDepth:
          type: integer
          minimum: 0
          maximum: 12
      additionalProperties: false
    outputSchema: *genericObjectOutputSchema
    annotations: *readOnlyAnnotations

  - name: workspace.symbols
    type: builtIn
    description: Query workspace symbol map. Returns unavailable until symbol support is enabled.
    inputSchema:
      type: object
      properties:
        query:
          type: string
        path:
          type: string
        kind:
          type: string
        cursor:
          type: string
        maxResults:
          type: integer
          minimum: 1
          maximum: 1000
      additionalProperties: false
    outputSchema: *genericObjectOutputSchema
    annotations: *readOnlyAnnotations

  - name: fs.tree
    type: builtIn
    description: Return a bounded workspace file tree while skipping protected paths.
    inputSchema:
      type: object
      properties:
        path:
          type: string
        mode:
          type: string
          enum: [files, dirs, packages, git-tracked, all]
        include:
          type: array
          items:
            type: string
        exclude:
          type: array
          items:
            type: string
        respectGitignore:
          type: boolean
        includeHidden:
          type: boolean
        includeIgnored:
          type: boolean
        depth:
          type: integer
          minimum: 0
          maximum: 12
        maxEntries:
          type: integer
          minimum: 1
          maximum: 5000
        cursor:
          type: string
      additionalProperties: false
    outputSchema: *genericObjectOutputSchema
    annotations: *readOnlyAnnotations

  - name: fs.search
    type: builtIn
    description: Search workspace text while skipping protected paths.
    inputSchema:
      type: object
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 500
        mode:
          type: string
          enum: [regex, fixed]
        path:
          type: string
        include:
          type: array
          items:
            type: string
        exclude:
          type: array
          items:
            type: string
        case:
          type: string
          enum: [smart, sensitive, insensitive]
        contextLines:
          type: integer
          minimum: 0
          maximum: 5
        maxResults:
          type: integer
          minimum: 1
          maximum: 1000
        maxColumns:
          type: integer
          minimum: 1
          maximum: 300
      required: [query]
      additionalProperties: false
    outputSchema: *genericObjectOutputSchema
    annotations: *readOnlyAnnotations

  - name: fs.read
    type: builtIn
    description: Read one workspace file in a bounded UTF-8 byte chunk.
    inputSchema:
      type: object
      properties:
        path:
          type: string
        byteOffset:
          type: integer
          minimum: 0
        range:
          type: object
          properties:
            startLine:
              type: integer
              minimum: 1
            endLine:
              type: integer
              minimum: 1
          required: [startLine, endLine]
          additionalProperties: false
        maxBytes:
          type: integer
          minimum: 1
          maximum: 131072
      required: [path]
      additionalProperties: false
    outputSchema: *genericObjectOutputSchema
    annotations: *readOnlyAnnotations

  - name: fs.read_many
    type: builtIn
    description: Read multiple workspace files in bounded UTF-8 byte chunks.
    inputSchema:
      type: object
      properties:
        files:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            properties:
              path:
                type: string
              byteOffset:
                type: integer
                minimum: 0
              maxBytes:
                type: integer
                minimum: 1
                maximum: 131072
              range:
                type: object
                properties:
                  startLine:
                    type: integer
                    minimum: 1
                  endLine:
                    type: integer
                    minimum: 1
                required: [startLine, endLine]
                additionalProperties: false
            required: [path]
            additionalProperties: false
        maxBytesPerFile:
          type: integer
          minimum: 1
          maximum: 131072
      required: [files]
      additionalProperties: false
    outputSchema: *genericObjectOutputSchema
    annotations: *readOnlyAnnotations

  - name: fs.stat
    type: builtIn
    description: Return metadata for one workspace path.
    inputSchema:
      type: object
      properties:
        path:
          type: string
        paths:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: string
      additionalProperties: false
    outputSchema: *genericObjectOutputSchema
    annotations: *readOnlyAnnotations

  - name: fs.manifest
    type: builtIn
    description: Return manifest entries with hashes for workspace paths.
    inputSchema:
      type: object
      properties:
        paths:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: string
      required: [paths]
      additionalProperties: false
    outputSchema: *genericObjectOutputSchema
    annotations: *readOnlyAnnotations

  - name: git.status
    type: builtIn
    description: Show concise Git worktree status.
    inputSchema: *emptyInputSchema
    outputSchema: &gitOutputSchema
      type: object
      properties:
        status:
          type: string
          enum: [ok, failed, timeout, unavailable]
        command:
          type: string
        exitCode:
          type: ["integer", "null"]
        stdout:
          type: string
        stderr:
          type: string
        durationMs:
          type: integer
        unavailableReason:
          type: string
      required: [status, command, exitCode, stdout, stderr, durationMs]
      additionalProperties: false
    annotations: *readOnlyAnnotations

  - name: git.changed
    type: builtIn
    description: Show changed files.
    inputSchema: *emptyInputSchema
    outputSchema: *gitOutputSchema
    annotations: *readOnlyAnnotations

  - name: git.diff
    type: builtIn
    description: Show staged or unstaged Git diff for the workspace or one path.
    inputSchema:
      type: object
      properties:
        scope:
          type: string
          enum: [unstaged, staged]
        path:
          type: string
        maxBytes:
          type: integer
          minimum: 1
          maximum: 60000
        cursor:
          type: string
      additionalProperties: false
    outputSchema: *gitOutputSchema
    annotations: *readOnlyAnnotations

  - name: git.show
    type: builtIn
    description: Show one Git revision with stat and patch.
    inputSchema:
      type: object
      properties:
        revision:
          type: string
          minLength: 1
          maxLength: 200
        path:
          type: string
        maxBytes:
          type: integer
          minimum: 1
          maximum: 60000
        cursor:
          type: string
      additionalProperties: false
    outputSchema: *gitOutputSchema
    annotations: *readOnlyAnnotations

  - name: git.blame
    type: builtIn
    description: Show line blame. Returns unavailable until blame support is enabled.
    inputSchema:
      type: object
      properties:
        path:
          type: string
        startLine:
          type: integer
          minimum: 1
        endLine:
          type: integer
          minimum: 1
      required: [path]
      additionalProperties: false
    outputSchema: *genericObjectOutputSchema
    annotations: *readOnlyAnnotations

  - name: git.commit_preview
    type: builtIn
    description: Preview an explicit-path commit. Returns unavailable until commit preview support is enabled.
    inputSchema:
      type: object
      properties:
        paths:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: string
      required: [paths]
      additionalProperties: false
    outputSchema: *genericObjectOutputSchema
    annotations: *readOnlyAnnotations

  - name: diagnostics.health
    type: builtIn
    description: Return webvibe relay diagnostics, tool surface version, hashes, and upstream health. This is for connector diagnostics, not the ChatGPT Web coding preflight.
    inputSchema: *emptyInputSchema
    outputSchema: *genericObjectOutputSchema
    annotations: *readOnlyAnnotations

audit:
  enabled: true
