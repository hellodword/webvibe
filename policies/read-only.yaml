version: 2
mode: read-only
profile: chatgptWebDefault

profiles:
  chatgptWebDefault:
    limits:
      output:
        preferredToolOutputBytes: 12000
        maxToolOutputBytes: 60000
      http:
        oauthMaxBodyBytes: 1048576
        mcpMaxBodyBytes: 16777216
      tree:
        defaultMaxEntries: 300
        maxEntries: 5000
        maxDepth: 12
      search:
        engine: rg
        defaultMaxResults: 80
        maxResults: 1000
        maxColumns: 300
        maxContextLines: 5
        maxScannedBytesPerFile: null
      read:
        defaultMaxBytes: 12000
        maxBytes: 131072
        maxReadManyFiles: 50
      change:
        maxFiles: 1000
        defaultMaxFiles: 200
        maxTotalBytes: 16777216
        maxTextFileBytes: 2097152
        maxInlineDiffBytes: 12288
        maxInlineDiffLines: 200
      task:
        defaultTimeoutSeconds: 300
        maxTimeoutSeconds: 3600
        outputHeadBytes: 12000
        outputTailBytes: 12000
      manual:
        ttlSeconds: 86400
        manualMessageMaxBytes: 65536
      rate:
        maxCallsPerMinute: 120

workspace:
  root: "${workspaceRoot}"
  protected:
    - ".git/**"
    - ".env"
    - "**/.env"
    - "**/*.pem"
    - "**/id_rsa"
    - "**/id_ed25519"
    - "node_modules/**"
    - "dist/**"
    - "build/**"

upstreams: {}

tools:
  - name: context.get
    type: builtIn
    description: ChatGPT Web coding preflight. Call this first before reading files, inspecting Git, planning changes, applying changes, running tasks, or committing. Returns workspace context, project manifests, task availability, upstream health, current tool surface version, warnings, and recommended workflow.
    inputSchema: &emptyInputSchema
      type: object
      additionalProperties: false
    outputSchema: &genericObjectOutputSchema
      type: object
      additionalProperties: true
    annotations: &readOnlyAnnotations
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false

  - name: read.tree
    type: builtIn
    description: Return a bounded workspace file tree while skipping protected paths. Requires context.get first.
    inputSchema:
      type: object
      properties:
        path:
          type: string
        depth:
          type: integer
          minimum: 0
          maximum: 12
        maxEntries:
          type: integer
          minimum: 1
          maximum: 5000
      additionalProperties: false
    outputSchema: *genericObjectOutputSchema
    annotations: *readOnlyAnnotations

  - name: read.search
    type: builtIn
    description: Search workspace text files by literal query while skipping protected paths. Requires context.get first.
    inputSchema:
      type: object
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 500
        path:
          type: string
        glob:
          type: string
        maxResults:
          type: integer
          minimum: 1
          maximum: 1000
        caseSensitive:
          type: boolean
      required: [query]
      additionalProperties: false
    outputSchema: *genericObjectOutputSchema
    annotations: *readOnlyAnnotations

  - name: read.files
    type: builtIn
    description: Read one or more workspace text files while enforcing protected paths and output limits. Defaults to 12000 content bytes per file; continue truncated files with nextOffsetBytes, and lower maxBytes if the host still truncates the result. Requires context.get first.
    inputSchema:
      type: object
      properties:
        paths:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
        offsetBytes:
          type: integer
          minimum: 0
        maxBytes:
          type: integer
          minimum: 1
          maximum: 131072
      required: [paths]
      additionalProperties: false
    outputSchema: *genericObjectOutputSchema
    annotations: *readOnlyAnnotations

  - name: read.stat
    type: builtIn
    description: Return metadata for one workspace path while enforcing protected paths. Requires context.get first.
    inputSchema:
      type: object
      properties:
        path:
          type: string
      required: [path]
      additionalProperties: false
    outputSchema: *genericObjectOutputSchema
    annotations: *readOnlyAnnotations

  - name: git.status
    type: builtIn
    description: Show concise Git worktree status. Requires context.get first.
    inputSchema: *emptyInputSchema
    outputSchema: &gitOutputSchema
      type: object
      properties:
        status:
          type: string
          enum: [ok, failed, timeout, unavailable]
        command:
          type: string
        exitCode:
          type: ["integer", "null"]
        stdout:
          type: string
        stderr:
          type: string
        durationMs:
          type: integer
        unavailableReason:
          type: string
      required: [status, command, exitCode, stdout, stderr, durationMs]
      additionalProperties: false
    annotations: *readOnlyAnnotations

  - name: git.diff
    type: builtIn
    description: Show staged or unstaged Git diff for the workspace or one path. Requires context.get first.
    inputSchema:
      type: object
      properties:
        scope:
          type: string
          enum: [unstaged, staged]
        path:
          type: string
      additionalProperties: false
    outputSchema: *gitOutputSchema
    annotations: *readOnlyAnnotations

  - name: git.history
    type: builtIn
    description: Show recent Git history. Requires context.get first.
    inputSchema:
      type: object
      properties:
        maxCount:
          type: integer
          minimum: 1
          maximum: 200
      additionalProperties: false
    outputSchema: *gitOutputSchema
    annotations: *readOnlyAnnotations

  - name: git.show
    type: builtIn
    description: Show one Git revision with stat and patch, optionally scoped to a path. Requires context.get first.
    inputSchema:
      type: object
      properties:
        revision:
          type: string
          minLength: 1
          maxLength: 200
        path:
          type: string
      additionalProperties: false
    outputSchema: *gitOutputSchema
    annotations: *readOnlyAnnotations

  - name: diagnostics.health
    type: builtIn
    description: Return webvibe relay diagnostics, tool surface version, hashes, and upstream health. This is for connector diagnostics, not the ChatGPT Web coding preflight.
    inputSchema: *emptyInputSchema
    outputSchema: *genericObjectOutputSchema
    annotations: *readOnlyAnnotations

audit:
  enabled: true
