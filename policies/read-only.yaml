version: 3
mode: read-only
profile: chatgptWebDefault

# editMode is still reported in read-only mode so clients know batch writes are disabled.
editMode:
  mode: single
  batch:
    enabled: false

# hostRisk is policy metadata for routing host-sensitive work to manual-first.
hostRisk:
  rawShellShape: manualFirst
  unknownTask: manualFirst
  largeDiffBytes: 12288
  deleteFileCount: 3

# taskCatalog declares capabilities the resolver can explain. It does not make
# a command runnable; task.run availability is decided by resolver checks.
taskCatalog: {}

profiles:
  chatgptWebDefault:
    limits:
      output:
        preferredToolOutputBytes: 12000
        maxToolOutputBytes: 60000
      http:
        oauthMaxBodyBytes: 1048576
        mcpMaxBodyBytes: 16777216
      tree:
        defaultMaxEntries: 300
        maxEntries: 5000
        maxDepth: 12
      search:
        engine: rg
        defaultMaxResults: 80
        maxResults: 1000
        maxColumns: 300
        maxContextLines: 5
        maxScannedBytesPerFile: null
      read:
        defaultMaxBytes: 12000
        maxBytes: 131072
        maxReadManyFiles: 50
      change:
        maxFiles: 1000
        defaultMaxFiles: 200
        maxTotalBytes: 16777216
        maxTextFileBytes: 2097152
        maxInlineDiffBytes: 12288
        maxInlineDiffLines: 200
      task:
        defaultTimeoutSeconds: 300
        maxTimeoutSeconds: 3600
        outputHeadBytes: 12000
        outputTailBytes: 12000
      manual:
        ttlSeconds: 86400
        manualMessageMaxBytes: 65536
      rate:
        maxCallsPerMinute: 120

workspace:
  root: "${workspaceRoot}"
  # protected paths are never bypassed by fs, git, or pass-through path policies.
  protected:
    - ".git/**"
    - ".env"
    - "**/.env"
    - "**/*.pem"
    - "**/id_rsa"
    - "**/id_ed25519"
    - "node_modules/**"
    - "dist/**"
    - "build/**"

taskBundles:
  node:
    packageManagers: [npm, pnpm, yarn, bun]
    scripts: [test, lint, typecheck, build, format]
    allowInstall: false
  go:
    tasks: [test_all, vet, fmt, mod_download, mod_tidy]
  rust:
    tasks: [test, check, clippy, fmt, build, fetch]
  flutter:
    tasks: [pub_get, analyze, test, dart_format]
  frontend:
    tasks: [playwright_test, cypress_run, vitest, jest, eslint, biome, prettier, tsc_noemit]
  codegen:
    tasks: [openapi_generate, prisma_generate, drizzle_generate, sqlc_generate, buf_lint, buf_generate]
  project:
    taskFiles: [make, just, task]
    allowedTargets: []

upstreams: {}

# This read-only preset exposes no passThrough, workflow, or manual tools. Any
# added passThrough tool must declare inputPolicy; workflows must declare fixed steps.
tools:
  - name: workspace.context
    type: builtIn
    description: Preflight context for ChatGPT Web coding. Call before workspace tools.
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false

  - name: workspace.scan
    type: builtIn
    description: Deep workspace scan for project manifests, languages, tools, task files, and codegen.
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false

  - name: workspace.symbols
    type: builtIn
    description: Query workspace symbol definitions and imports.
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false

  - name: fs.tree
    type: builtIn
    description: Return a bounded workspace file tree while skipping protected paths.
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false

  - name: fs.search
    type: builtIn
    description: Search workspace text while skipping protected paths.
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false

  - name: fs.read
    type: builtIn
    description: Read one workspace file in a bounded UTF-8 byte chunk.
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false

  - name: fs.read_many
    type: builtIn
    description: Read multiple workspace files in bounded UTF-8 byte chunks.
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false

  - name: fs.stat
    type: builtIn
    description: Return metadata for one or more workspace paths.
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false

  - name: fs.manifest
    type: builtIn
    description: Return manifest entries with hashes for workspace paths.
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false

  - name: git.status
    type: builtIn
    description: Show concise Git worktree status.
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false

  - name: git.changed
    type: builtIn
    description: Show changed files.
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false

  - name: git.diff
    type: builtIn
    description: Show staged or unstaged Git diff for the workspace or one path.
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false

  - name: git.show
    type: builtIn
    description: Show one Git revision with stat and patch.
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false

  - name: git.blame
    type: builtIn
    description: Show Git line blame for a workspace file.
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false

  - name: git.commit_preview
    type: builtIn
    description: Preview an explicit-path Git commit without writing it.
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false

  - name: diagnostics.health
    type: builtIn
    description: Return webvibe relay diagnostics, tool surface version, hashes, and upstream health.
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false

audit:
  enabled: true
