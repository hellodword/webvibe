version: 1
mode: read-only

workspace:
  root: "${workspaceRoot}"
  protected:
    - ".git/**"
    - ".env"
    - "**/.env"
    - "**/*.pem"
    - "**/id_rsa"
    - "**/id_ed25519"
    - "node_modules/**"
    - "dist/**"
    - "build/**"

upstreams:
  fs:
    transport: stdio
    command: npx
    args:
      - -y
      - "@modelcontextprotocol/server-filesystem"
      - "${workspaceRoot}"

tools:
  - name: relay.info
    type: builtIn
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false

  - name: relay.list_upstreams
    type: builtIn
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false

  - name: relay.list_tools
    type: builtIn
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false

  - name: env.inspect
    type: builtIn
    description: Inspect the current local environment with sanitized ENV/PATH, command availability, project manifests, webvibe tools, and guidance.
    inputSchema:
      type: object
      additionalProperties: false
    outputSchema: &genericObjectOutputSchema
      type: object
      additionalProperties: true
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false

  - name: project.inspect
    type: builtIn
    description: Inspect project manifests, lockfiles, package managers, languages, and npm scripts.
    inputSchema:
      type: object
      properties:
        maxDepth:
          type: integer
          minimum: 0
          maximum: 8
        maxManifests:
          type: integer
          minimum: 1
          maximum: 200
      additionalProperties: false
    outputSchema: *genericObjectOutputSchema
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false

  - name: code.search
    type: builtIn
    description: Search workspace text files by literal query while skipping protected paths.
    inputSchema:
      type: object
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 500
        path:
          type: string
        glob:
          type: string
        maxResults:
          type: integer
          minimum: 1
          maximum: 200
        caseSensitive:
          type: boolean
      required: [query]
      additionalProperties: false
    outputSchema: *genericObjectOutputSchema
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false

  - name: code.file_tree
    type: builtIn
    description: Return a bounded workspace file tree while skipping protected paths.
    inputSchema:
      type: object
      properties:
        path:
          type: string
        depth:
          type: integer
          minimum: 0
          maximum: 8
        maxEntries:
          type: integer
          minimum: 1
          maximum: 1000
      additionalProperties: false
    outputSchema: *genericObjectOutputSchema
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false

  - name: fs.read_text_file
    type: passThrough
    upstream: fs
    upstreamTool: read_text_file
    inputPolicy:
      pathFields: ["path"]
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false

  - name: fs.read_multiple_files
    type: passThrough
    upstream: fs
    upstreamTool: read_multiple_files
    inputPolicy:
      pathFields: ["paths"]
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false

  - name: fs.list_directory
    type: passThrough
    upstream: fs
    upstreamTool: list_directory
    inputPolicy:
      pathFields: ["path"]
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false

  - name: fs.search_files
    type: passThrough
    upstream: fs
    upstreamTool: search_files
    inputPolicy:
      pathFields: ["path"]
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false

  - name: fs.get_file_info
    type: passThrough
    upstream: fs
    upstreamTool: get_file_info
    inputPolicy:
      pathFields: ["path"]
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false

  - name: git.status
    type: builtIn
    inputSchema: &emptyInputSchema
      type: object
      additionalProperties: false
    outputSchema: &gitOutputSchema
      type: object
      properties:
        status:
          type: string
          enum: [ok, failed, timeout, unavailable]
        command:
          type: string
        exitCode:
          type: ["integer", "null"]
        stdout:
          type: string
        stderr:
          type: string
        durationMs:
          type: integer
        unavailableReason:
          type: string
      required: [status, command, exitCode, stdout, stderr, durationMs]
      additionalProperties: false
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false

  - name: git.diff_unstaged
    type: builtIn
    inputSchema: &gitPathInputSchema
      type: object
      properties:
        path:
          type: string
      additionalProperties: false
    outputSchema: *gitOutputSchema
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false

  - name: git.diff_staged
    type: builtIn
    inputSchema: *gitPathInputSchema
    outputSchema: *gitOutputSchema
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false

  - name: git.log
    type: builtIn
    inputSchema:
      type: object
      properties:
        maxCount:
          type: integer
          minimum: 1
          maximum: 200
      additionalProperties: false
    outputSchema: *gitOutputSchema
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false

  - name: git.show
    type: builtIn
    inputSchema:
      type: object
      properties:
        revision:
          type: string
          minLength: 1
          maxLength: 200
        path:
          type: string
      additionalProperties: false
    outputSchema: *gitOutputSchema
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false

  - name: git.branch
    type: builtIn
    inputSchema:
      type: object
      properties:
        all:
          type: boolean
      additionalProperties: false
    outputSchema: *gitOutputSchema
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false

  - name: git.ls_files
    type: builtIn
    inputSchema: *gitPathInputSchema
    outputSchema: *gitOutputSchema
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false

  - name: git.rev_parse
    type: builtIn
    inputSchema:
      type: object
      properties:
        revision:
          type: string
          minLength: 1
          maxLength: 200
      additionalProperties: false
    outputSchema: *gitOutputSchema
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false

limits:
  maxToolOutputBytes: 60000
  timeoutMs: 30000

audit:
  enabled: true
