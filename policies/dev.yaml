version: 3
mode: dev
profile: chatgptWebDefault

# editMode keeps default write tools to one logical change per preview/apply.
# batch.enabled must stay false unless the policy also exposes batch tools.
editMode:
  mode: single
  batch:
    enabled: false

# hostRisk controls routing hints for host-sensitive work. rawShellShape and
# unknownTask are manual-first by policy; change previews use the thresholds.
hostRisk:
  rawShellShape: manualFirst
  unknownTask: manualFirst
  largeDiffBytes: 12288
  deleteFileCount: 3

# taskCatalog documents capabilities the resolver may consider. It is not a
# runnable command catalog; task.run remains limited to resolved task IDs.
taskCatalog:
  node.test:
    family: node
    intent: test
    resolver: nodeScript
    scriptNames: [test]
    taskIds: [node.test]
    hostRisk: medium
    description: Run the package test script when present.
  node.build:
    family: node
    intent: build
    resolver: nodeScript
    scriptNames: [build]
    taskIds: [node.build]
    hostRisk: medium
    description: Run the package build script when present.
  node.lint:
    family: node
    intent: lint
    resolver: nodeScriptOrTool
    scriptNames: [lint]
    taskIds: [node.lint]
    fallbackTools:
      - executable: npx
        args: [eslint, .]
    hostRisk: medium
    description: Run configured lint checks when present.

profiles:
  chatgptWebDefault:
    limits:
      output:
        preferredToolOutputBytes: 12000
        maxToolOutputBytes: 60000
      http:
        oauthMaxBodyBytes: 1048576
        mcpMaxBodyBytes: 16777216
      tree:
        defaultMaxEntries: 300
        maxEntries: 5000
        maxDepth: 12
      search:
        engine: rg
        defaultMaxResults: 80
        maxResults: 1000
        maxColumns: 300
        maxContextLines: 5
        maxScannedBytesPerFile: null
      read:
        defaultMaxBytes: 12000
        maxBytes: 131072
        maxReadManyFiles: 50
      change:
        maxFiles: 1000
        defaultMaxFiles: 200
        maxTotalBytes: 16777216
        maxTextFileBytes: 2097152
        maxInlineDiffBytes: 12288
        maxInlineDiffLines: 200
      task:
        defaultTimeoutSeconds: 300
        maxTimeoutSeconds: 3600
        outputHeadBytes: 12000
        outputTailBytes: 12000
      manual:
        ttlSeconds: 86400
        manualMessageMaxBytes: 65536
      rate:
        maxCallsPerMinute: 120

workspace:
  root: "${workspaceRoot}"
  # protected paths are never bypassed by fs, change, git, manual, or pass-through path policies.
  protected:
    - ".git/**"
    - ".env"
    - "**/.env"
    - "**/*.pem"
    - "**/id_rsa"
    - "**/id_ed25519"
    - "node_modules/**"
    - "dist/**"
    - "build/**"

taskBundles:
  node:
    packageManagers: [npm, pnpm, yarn, bun]
    scripts: [test, lint, typecheck, build, format]
    allowInstall: true
  go:
    tasks: [test_all, vet, fmt, mod_download, mod_tidy]
  rust:
    tasks: [test, check, clippy, fmt, build, fetch]
  flutter:
    tasks: [pub_get, analyze, test, dart_format]
  frontend:
    tasks: [playwright_test, cypress_run, vitest, jest, eslint, biome, prettier, tsc_noemit]
  codegen:
    tasks: [openapi_generate, prisma_generate, drizzle_generate, sqlc_generate, buf_lint, buf_generate]
  project:
    taskFiles: [make, just, task]
    allowedTargets: []

upstreams:
  tasks:
    transport: local-task-runner
    cwd: "${workspaceRoot}"
    tasks:
      node.test:
        executable: npm
        args: ["test"]
        requiredPackageScript: test
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      node.build:
        executable: npm
        args: ["run", "build"]
        requiredPackageScript: build
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      node.lint:
        executable: npm
        args: ["run", "lint"]
        requiredPackageScript: lint
        defaultTimeoutSeconds: 1800
        maxTimeoutSeconds: 36000
      node.typecheck:
        executable: npm
        args: ["run", "typecheck"]
        requiredPackageScript: typecheck
        defaultTimeoutSeconds: 1800
        maxTimeoutSeconds: 36000
      node.start:
        executable: npm
        args: ["start"]
        requiredPackageScript: start
        defaultTimeoutSeconds: 300
        maxTimeoutSeconds: 36000
      node.install:
        executable: npm
        args: ["install"]
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      node.ci:
        executable: npm
        args: ["ci"]
        requiredFiles: ["package-lock.json"]
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      node.add_package:
        executable: npm
        args: ["install"]
        allowExtraArgs: true
        maxExtraArgs: 21
        allowedExtraArgs: ["--save-dev"]
        extraArgPattern: '^(?:@[-A-Za-z0-9_.]+/)?[-A-Za-z0-9_.]+(?:@[-A-Za-z0-9_.*~^<>!=+:/]+)?$'
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      node.remove_package:
        executable: npm
        args: ["uninstall"]
        allowExtraArgs: true
        maxExtraArgs: 20
        extraArgPattern: '^(?:@[-A-Za-z0-9_.]+/)?[-A-Za-z0-9_.]+$'
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      node.format:
        executable: npm
        args: ["run", "format"]
        requiredPackageScript: format
        defaultTimeoutSeconds: 1800
        maxTimeoutSeconds: 36000
      node.lint_fix:
        executable: npm
        args: ["run", "lint", "--", "--fix"]
        requiredPackageScript: lint
        defaultTimeoutSeconds: 1800
        maxTimeoutSeconds: 36000
      cargo_test:
        executable: cargo
        args: ["test"]
        defaultTimeoutSeconds: 6000
        maxTimeoutSeconds: 36000
      cargo_check:
        executable: cargo
        args: ["check"]
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      cargo_build:
        executable: cargo
        args: ["build"]
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      cargo_clippy:
        executable: cargo
        args: ["clippy", "--all-targets", "--all-features"]
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      cargo_fmt_check:
        executable: cargo
        args: ["fmt", "--check"]
        defaultTimeoutSeconds: 600
        maxTimeoutSeconds: 36000
      cargo_fetch:
        executable: cargo
        args: ["fetch"]
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      cargo_update:
        executable: cargo
        args: ["update"]
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      cargo_add:
        executable: cargo
        args: ["add"]
        allowExtraArgs: true
        maxExtraArgs: 20
        extraArgPattern: '^[A-Za-z0-9_-]+(?:@[A-Za-z0-9_.+~-]+)?$'
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      cargo_fmt:
        executable: cargo
        args: ["fmt"]
        defaultTimeoutSeconds: 600
        maxTimeoutSeconds: 36000
      go_test:
        executable: go
        args: ["test", "./..."]
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      go_build:
        executable: go
        args: ["build", "./..."]
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      go_vet:
        executable: go
        args: ["vet", "./..."]
        defaultTimeoutSeconds: 1800
        maxTimeoutSeconds: 36000
      go_fmt_check:
        executable: gofmt
        args: ["-l", "."]
        defaultTimeoutSeconds: 600
        maxTimeoutSeconds: 36000
        failOnStdout: true
      go_mod_download:
        executable: go
        args: ["mod", "download"]
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      go_mod_tidy:
        executable: go
        args: ["mod", "tidy"]
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      go_get:
        executable: go
        args: ["get"]
        allowExtraArgs: true
        maxExtraArgs: 20
        extraArgPattern: '^[A-Za-z0-9_.~+:/@-]+(?:/[A-Za-z0-9_.~+:/@-]+)*$'
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      go_fmt:
        executable: go
        args: ["fmt", "./..."]
        defaultTimeoutSeconds: 600
        maxTimeoutSeconds: 36000
      uv_sync:
        executable: uv
        args: ["sync"]
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      uv_add:
        executable: uv
        args: ["add"]
        allowExtraArgs: true
        maxExtraArgs: 20
        extraArgPattern: '^[A-Za-z0-9_.@/+~!<>=\[\],:-]+$'
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      uv_run_pytest:
        executable: uv
        args: ["run", "pytest"]
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      pip_install_requirements:
        executable: pip
        args: ["install", "-r", "requirements.txt"]
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000

# Built-in presets expose no passThrough or workflow tools. Any passThrough tool
# added here must declare inputPolicy; any workflow tool must declare fixed steps.
tools:
  - name: workspace.context
    type: builtIn
    description: Preflight context for ChatGPT Web coding. Call before workspace tools.
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false

  - name: workspace.scan
    type: builtIn
    description: Deep workspace scan for project manifests, languages, tools, task files, and codegen.
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false

  - name: workspace.symbols
    type: builtIn
    description: Query workspace symbol definitions and imports.
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false

  - name: fs.tree
    type: builtIn
    description: Return a bounded workspace file tree while skipping protected paths.
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false

  - name: fs.search
    type: builtIn
    description: Search workspace text while skipping protected paths.
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false

  - name: fs.read
    type: builtIn
    description: Read one workspace file in a bounded UTF-8 byte chunk.
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false

  - name: fs.read_many
    type: builtIn
    description: Read multiple workspace files in bounded UTF-8 byte chunks.
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false

  - name: fs.stat
    type: builtIn
    description: Return metadata for one or more workspace paths.
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false

  - name: fs.manifest
    type: builtIn
    description: Return manifest entries with hashes for workspace paths.
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false

  - name: file.change_preview
    type: builtIn
    description: Validate and diff one logical workspace file change.
    annotations:
      readOnlyHint: false
      destructiveHint: false
      openWorldHint: false

  - name: manual.prepare
    type: builtIn
    description: Prepare low-risk manual continuation metadata before showing manual instructions and opening manual.gate.
    annotations:
      readOnlyHint: false
      destructiveHint: false
      openWorldHint: false

  - name: manual.gate
    type: builtIn
    description: Open a manual barrier after manual instructions were shown in chat.
    annotations:
      readOnlyHint: false
      destructiveHint: false
      openWorldHint: false

  - name: manual.status
    type: builtIn
    description: Report current pending manual action for this caller. Allowed while manual work is pending.
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false

  - name: manual.resume
    type: builtIn
    description: Resume or cancel a pending manual action from a later user message that starts with /resume.
    annotations:
      readOnlyHint: false
      destructiveHint: false
      openWorldHint: false

  - name: file.change_apply
    type: builtIn
    description: Apply one logical workspace file change after preview.
    annotations:
      readOnlyHint: false
      destructiveHint: true
      openWorldHint: false

  - name: task.list
    type: builtIn
    description: List available and unavailable policy-defined tasks.
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false

  - name: task.explain
    type: builtIn
    description: Explain resolver checks and next route for one taskId or candidate task id.
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false

  - name: task.run
    type: builtIn
    description: Run one policy-defined local task by taskId. No free-form command input.
    annotations:
      readOnlyHint: false
      destructiveHint: true
      openWorldHint: false

  - name: task.result
    type: builtIn
    description: Read task run status and log summaries by runId.
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false

  - name: git.status
    type: builtIn
    description: Show concise Git worktree status.
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false

  - name: git.changed
    type: builtIn
    description: Show changed files.
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false

  - name: git.diff
    type: builtIn
    description: Show staged or unstaged Git diff for the workspace or one path.
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false

  - name: git.show
    type: builtIn
    description: Show one Git revision with stat and patch.
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false

  - name: git.blame
    type: builtIn
    description: Show Git line blame for a workspace file.
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false

  - name: git.commit_preview
    type: builtIn
    description: Preview an explicit-path Git commit without writing it.
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false

  - name: git.commit
    type: builtIn
    description: Commit only explicit workspace-relative paths with the provided message.
    annotations:
      readOnlyHint: false
      destructiveHint: true
      openWorldHint: false

  - name: diagnostics.health
    type: builtIn
    description: Return webvibe relay diagnostics, tool surface version, hashes, and upstream health.
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false

audit:
  enabled: true
  maxLogBytes: 10485760
  payloads: full-redacted
  includeClientVisibleOutput: true
  includeRawToolOutput: true
  includeErrors: true
  includeErrorStack: true
  includeManualEvents: true
  redact: true
