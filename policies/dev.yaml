  - name: task.npm_ci
    type: workflow
    description: Run npm ci in the configured workspace.
    inputSchema: *taskInputSchema
    outputSchema: *taskOutputSchema
    timeoutSeconds:
      default: 3000
      maximum: 36000
    annotations: *taskAnnotations
    steps:
      - call:
          upstream: tasks
          tool: run_task
          input:
            taskId: npm_ci
            timeoutSeconds: "${coalesce(input.timeoutSeconds, 3000)}"

  - name: task.npm_add_package
    type: workflow
    description: Add one or more npm packages in the configured workspace.
    inputSchema: &npmPackageTaskInputSchema
      type: object
      properties:
        packages:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 200
        dev:
          type: boolean
        timeoutSeconds:
          type: integer
          minimum: 1
          maximum: 36000
      required: [packages]
      additionalProperties: false
    outputSchema: *taskOutputSchema
    timeoutSeconds:
      default: 3000
      maximum: 36000
    annotations: *taskAnnotations
    steps:
      - call:
          upstream: tasks
          tool: run_task
          input:
            taskId: npm_add_package
            extraArgs: "${input.dev ? ['--save-dev', ...input.packages] : input.packages}"
            timeoutSeconds: "${coalesce(input.timeoutSeconds, 3000)}"

  - name: task.npm_remove_package
    type: workflow
    description: Remove one or more npm packages in the configured workspace.
    inputSchema: *npmPackageTaskInputSchema
    outputSchema: *taskOutputSchema
    timeoutSeconds:
      default: 3000
      maximum: 36000
    annotations: *taskAnnotations
    steps:
