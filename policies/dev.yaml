          upstream: tasks
          tool: run_task
          input:
            taskId: npm_remove_package
            extraArgs: "${input.packages}"
            timeoutSeconds: "${coalesce(input.timeoutSeconds, 3000)}"

  - name: task.npm_format
    type: workflow
    description: Run the npm format script in the configured workspace.
    inputSchema: *taskInputSchema
    outputSchema: *taskOutputSchema
    timeoutSeconds:
      default: 1800
      maximum: 36000
    annotations: *taskAnnotations
    steps:
      - call:
          upstream: tasks
          tool: run_task
          input:
            taskId: npm_format
            timeoutSeconds: "${coalesce(input.timeoutSeconds, 1800)}"

  - name: task.npm_lint_fix
    type: workflow
    description: Run npm lint with --fix in the configured workspace.
    inputSchema: *taskInputSchema
    outputSchema: *taskOutputSchema
    timeoutSeconds:
      default: 1800
      maximum: 36000
    annotations: *taskAnnotations
    steps:
      - call:
          upstream: tasks
          tool: run_task
          input:
            taskId: npm_lint_fix
            timeoutSeconds: "${coalesce(input.timeoutSeconds, 1800)}"

  - name: task.cargo_test
    type: workflow
    description: Run cargo test in the configured workspace.
    inputSchema: *taskInputSchema
    outputSchema: *taskOutputSchema
    timeoutSeconds:
      default: 6000
