version: 1
mode: dev

extends: ./read-only.yaml

upstreams:
  tasks:
    transport: local-task-runner
    cwd: "${workspaceRoot}"
    tasks:
      npm_test:
        executable: npm
        args: ["test"]
        requiredFiles: ["package.json"]
        requiredPackageScript: test
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      npm_build:
        executable: npm
        args: ["run", "build", "--if-present"]
        requiredFiles: ["package.json"]
        requiredPackageScript: build
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      npm_lint:
        executable: npm
        args: ["run", "lint", "--if-present"]
        requiredFiles: ["package.json"]
        requiredPackageScript: lint
        defaultTimeoutSeconds: 1800
        maxTimeoutSeconds: 36000
      npm_typecheck:
        executable: npm
        args: ["run", "typecheck", "--if-present"]
        requiredFiles: ["package.json"]
        requiredPackageScript: typecheck
        defaultTimeoutSeconds: 1800
        maxTimeoutSeconds: 36000
      npm_start:
        executable: npm
        args: ["start"]
        requiredFiles: ["package.json"]
        requiredPackageScript: start
        defaultTimeoutSeconds: 300
        maxTimeoutSeconds: 36000
      npm_install:
        executable: npm
        args: ["install"]
        requiredFiles: ["package.json"]
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      npm_ci:
        executable: npm
        args: ["ci"]
        requiredFiles: ["package.json", "package-lock.json"]
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      npm_add_package:
        executable: npm
        args: ["install"]
        requiredFiles: ["package.json"]
        allowExtraArgs: true
        maxExtraArgs: 21
        allowedExtraArgs: ["--save-dev"]
        extraArgPattern: '^(?:@[-A-Za-z0-9_.]+/)?[-A-Za-z0-9_.]+(?:@[-A-Za-z0-9_.*~^<>!=+:/]+)?$'
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      npm_remove_package:
        executable: npm
        args: ["uninstall"]
        requiredFiles: ["package.json"]
        allowExtraArgs: true
        maxExtraArgs: 20
        extraArgPattern: '^(?:@[-A-Za-z0-9_.]+/)?[-A-Za-z0-9_.]+$'
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      npm_format:
        executable: npm
        args: ["run", "format"]
        requiredFiles: ["package.json"]
        requiredPackageScript: format
        defaultTimeoutSeconds: 1800
        maxTimeoutSeconds: 36000
      npm_lint_fix:
        executable: npm
        args: ["run", "lint", "--", "--fix"]
        requiredFiles: ["package.json"]
        requiredPackageScript: lint
        defaultTimeoutSeconds: 1800
        maxTimeoutSeconds: 36000
      cargo_test:
        executable: cargo
        args: ["test"]
        requiredFiles: ["Cargo.toml"]
        defaultTimeoutSeconds: 6000
        maxTimeoutSeconds: 36000
      cargo_check:
        executable: cargo
        args: ["check"]
        requiredFiles: ["Cargo.toml"]
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      cargo_build:
        executable: cargo
        args: ["build"]
        requiredFiles: ["Cargo.toml"]
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      cargo_clippy:
        executable: cargo
        args: ["clippy", "--all-targets", "--all-features"]
        requiredFiles: ["Cargo.toml"]
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      cargo_fmt_check:
        executable: cargo
        args: ["fmt", "--check"]
        requiredFiles: ["Cargo.toml"]
        defaultTimeoutSeconds: 600
        maxTimeoutSeconds: 36000
      cargo_fetch:
        executable: cargo
        args: ["fetch"]
        requiredFiles: ["Cargo.toml"]
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      cargo_update:
        executable: cargo
        args: ["update"]
        requiredFiles: ["Cargo.toml"]
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      cargo_add:
        executable: cargo
        args: ["add"]
        requiredFiles: ["Cargo.toml"]
        allowExtraArgs: true
        maxExtraArgs: 20
        extraArgPattern: '^[A-Za-z0-9_-]+(?:@[A-Za-z0-9_.+~-]+)?$'
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      cargo_fmt:
        executable: cargo
        args: ["fmt"]
        requiredFiles: ["Cargo.toml"]
        defaultTimeoutSeconds: 600
        maxTimeoutSeconds: 36000
      go_test:
        executable: go
        args: ["test", "./..."]
        requiredFiles: ["go.mod"]
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      go_build:
        executable: go
        args: ["build", "./..."]
        requiredFiles: ["go.mod"]
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      go_vet:
        executable: go
        args: ["vet", "./..."]
        requiredFiles: ["go.mod"]
        defaultTimeoutSeconds: 1800
        maxTimeoutSeconds: 36000
      go_fmt_check:
        executable: gofmt
        args: ["-l", "."]
        requiredFiles: ["go.mod"]
        defaultTimeoutSeconds: 600
        maxTimeoutSeconds: 36000
        failOnStdout: true
      go_mod_download:
        executable: go
        args: ["mod", "download"]
        requiredFiles: ["go.mod"]
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      go_mod_tidy:
        executable: go
        args: ["mod", "tidy"]
        requiredFiles: ["go.mod"]
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      go_get:
        executable: go
        args: ["get"]
        requiredFiles: ["go.mod"]
        allowExtraArgs: true
        maxExtraArgs: 20
        extraArgPattern: '^[A-Za-z0-9_.~+:/@-]+(?:/[A-Za-z0-9_.~+:/@-]+)*$'
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      go_fmt:
        executable: go
        args: ["fmt", "./..."]
        requiredFiles: ["go.mod"]
        defaultTimeoutSeconds: 600
        maxTimeoutSeconds: 36000
      uv_sync:
        executable: uv
        args: ["sync"]
        requiredFiles: ["pyproject.toml"]
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      uv_add:
        executable: uv
        args: ["add"]
        requiredFiles: ["pyproject.toml"]
        allowExtraArgs: true
        maxExtraArgs: 20
        extraArgPattern: '^[A-Za-z0-9_.@/+~!<>=\[\],:-]+$'
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      uv_run_pytest:
        executable: uv
        args: ["run", "pytest"]
        requiredFiles: ["pyproject.toml"]
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      pip_install_requirements:
        executable: pip
        args: ["install", "-r", "requirements.txt"]
        requiredFiles: ["requirements.txt"]
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000

tools:
  - name: repo.file_manifest
    type: builtIn
    description: Use this before editing to get current workspace file hashes for one or more paths.
    inputSchema:
      type: object
      properties:
        paths:
          type: array
          minItems: 1
          items:
            type: string
      required: [paths]
      additionalProperties: false
    outputSchema:
      type: object
      properties:
        files:
          type: array
          items:
            type: object
            additionalProperties: true
      required: [files]
      additionalProperties: false
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false

  - name: repo.preview_changeset
    type: builtIn
    description: Use this to validate and preview a complete multi-file workspace changeset before applying it.
    inputSchema: &changesetInputSchema
      type: object
      properties:
        baseRevision:
          type: string
        changes:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              op:
                type: string
                enum: [create, replace, edit, delete, mkdir]
              path:
                type: string
              expectedSha256:
                type: string
              content:
                type: string
              edits:
                type: array
                minItems: 1
                items:
                  type: object
                  properties:
                    oldText:
                      type: string
                    newText:
                      type: string
                    replaceAll:
                      type: boolean
                  required: [oldText, newText]
                  additionalProperties: false
            required: [op, path]
            additionalProperties: false
      required: [changes]
      additionalProperties: false
    outputSchema:
      type: object
      properties:
        valid:
          type: boolean
        baseRevision:
          type: string
        summary:
          type: object
          additionalProperties: true
        files:
          type: array
          items:
            type: object
            additionalProperties: true
        diff:
          type: string
        conflicts:
          type: array
          items:
            type: object
            additionalProperties: true
      required: [valid, summary, files, diff, conflicts]
      additionalProperties: false
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false
    _meta:
      "openai/toolInvocation/invoking": "Previewing changes"
      "openai/toolInvocation/invoked": "Changes previewed"

  - name: repo.apply_changeset
    type: builtIn
    description: Use this to apply a complete reviewed multi-file workspace changeset in one write operation.
    inputSchema: *changesetInputSchema
    outputSchema:
      type: object
      properties:
        applied:
          type: boolean
        baseRevision:
          type: string
        summary:
          type: object
          additionalProperties: true
        files:
          type: array
          items:
            type: object
            additionalProperties: true
        conflicts:
          type: array
          items:
            type: object
            additionalProperties: true
      required: [applied, summary, files, conflicts]
      additionalProperties: false
    annotations:
      readOnlyHint: false
      destructiveHint: true
      openWorldHint: false
    _meta:
      "openai/toolInvocation/invoking": "Applying changes"
      "openai/toolInvocation/invoked": "Changes applied"

  - name: git.commit_paths
    type: builtIn
    description: Commit only explicit workspace-relative paths with the provided message; protected paths are rejected and unrelated dirty files are not included.
    inputSchema:
      type: object
      properties:
        paths:
          type: array
          minItems: 1
          maxItems: 80
          items:
            type: string
        message:
          type: string
          minLength: 1
          maxLength: 500
      required: [paths, message]
      additionalProperties: false
    outputSchema:
      type: object
      properties:
        status:
          type: string
          enum: [ok, failed, timeout, unavailable]
        command:
          type: string
        exitCode:
          type: ["integer", "null"]
        stdout:
          type: string
        stderr:
          type: string
        durationMs:
          type: integer
        unavailableReason:
          type: string
      required: [status, command, exitCode, stdout, stderr, durationMs]
      additionalProperties: false
    annotations:
      readOnlyHint: false
      destructiveHint: true
      openWorldHint: false

  - name: task.npm_test
    type: workflow
    description: Run the npm test script in the configured workspace.
    inputSchema: &taskInputSchema
      type: object
      properties:
        timeoutSeconds:
          type: integer
          minimum: 1
          maximum: 36000
      additionalProperties: false
    outputSchema: &taskOutputSchema
      type: object
      properties:
        status:
          type: string
          enum: [ok, failed, timeout, unavailable]
        taskId:
          type: string
        exitCode:
          type: ["integer", "null"]
        stdout:
          type: string
        stderr:
          type: string
        durationMs:
          type: integer
        timeoutSeconds:
          type: integer
        unavailableReason:
          type: string
      required: [status, taskId, exitCode, stdout, stderr, durationMs, timeoutSeconds]
      additionalProperties: false
    timeoutSeconds:
      default: 3000
      maximum: 36000
    annotations: &taskAnnotations
      readOnlyHint: false
      destructiveHint: false
      openWorldHint: false
    steps:
      - call:
          upstream: tasks
          tool: run_task
          input:
            taskId: npm_test
            timeoutSeconds: "${coalesce(input.timeoutSeconds, 3000)}"

  - name: task.npm_build
    type: workflow
    description: Run the npm build script in the configured workspace.
    inputSchema: *taskInputSchema
    outputSchema: *taskOutputSchema
    timeoutSeconds:
      default: 3000
      maximum: 36000
    annotations: *taskAnnotations
    steps:
      - call:
          upstream: tasks
          tool: run_task
          input:
            taskId: npm_build
            timeoutSeconds: "${coalesce(input.timeoutSeconds, 3000)}"

  - name: task.npm_lint
    type: workflow
    description: Run the npm lint script in the configured workspace.
    inputSchema: *taskInputSchema
    outputSchema: *taskOutputSchema
    timeoutSeconds:
      default: 1800
      maximum: 36000
    annotations: *taskAnnotations
    steps:
      - call:
          upstream: tasks
          tool: run_task
          input:
            taskId: npm_lint
            timeoutSeconds: "${coalesce(input.timeoutSeconds, 1800)}"

  - name: task.npm_typecheck
    type: workflow
    description: Run the npm typecheck script in the configured workspace.
    inputSchema: *taskInputSchema
    outputSchema: *taskOutputSchema
    timeoutSeconds:
      default: 1800
      maximum: 36000
    annotations: *taskAnnotations
    steps:
      - call:
          upstream: tasks
          tool: run_task
          input:
            taskId: npm_typecheck
            timeoutSeconds: "${coalesce(input.timeoutSeconds, 1800)}"

  - name: task.npm_start
    type: workflow
    description: Run the npm start script in the configured workspace.
    inputSchema: *taskInputSchema
    outputSchema: *taskOutputSchema
    timeoutSeconds:
      default: 300
      maximum: 36000
    annotations: *taskAnnotations
    steps:
      - call:
          upstream: tasks
          tool: run_task
          input:
            taskId: npm_start
            timeoutSeconds: "${coalesce(input.timeoutSeconds, 300)}"

  - name: task.npm_install
    type: workflow
    description: Run npm install in the configured workspace.
    inputSchema: *taskInputSchema
    outputSchema: *taskOutputSchema
    timeoutSeconds:
      default: 3000
      maximum: 36000
    annotations: *taskAnnotations
    steps:
      - call:
          upstream: tasks
          tool: run_task
