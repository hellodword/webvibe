version: 1
mode: dev

workspace:
  root: "${workspaceRoot}"
  protected:
    - ".git/**"
    - ".env"
    - "**/.env"
    - "**/*.pem"
    - "**/id_rsa"
    - "**/id_ed25519"
    - "node_modules/**"
    - "dist/**"
    - "build/**"

upstreams:
  tasks:
    transport: local-task-runner
    cwd: "${workspaceRoot}"
    tasks:
      npm_test:
        executable: npm
        args: ["test"]
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      npm_build:
        executable: npm
        args: ["run", "build", "--if-present"]
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      npm_lint:
        executable: npm
        args: ["run", "lint", "--if-present"]
        defaultTimeoutSeconds: 1800
        maxTimeoutSeconds: 36000
      npm_typecheck:
        executable: npm
        args: ["run", "typecheck", "--if-present"]
        defaultTimeoutSeconds: 1800
        maxTimeoutSeconds: 36000
      npm_start:
        executable: npm
        args: ["start"]
        defaultTimeoutSeconds: 300
        maxTimeoutSeconds: 36000
      npm_install:
        executable: npm
        args: ["install"]
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      npm_ci:
        executable: npm
        args: ["ci"]
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      npm_add_package:
        executable: npm
        args: ["install"]
        allowExtraArgs: true
        maxExtraArgs: 21
        allowedExtraArgs: ["--save-dev"]
        extraArgPattern: '^(?:@[-A-Za-z0-9_.]+/)?[-A-Za-z0-9_.]+(?:@[-A-Za-z0-9_.*~^<>!=+:/]+)?$'
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      npm_remove_package:
        executable: npm
        args: ["uninstall"]
        allowExtraArgs: true
        maxExtraArgs: 20
        extraArgPattern: '^(?:@[-A-Za-z0-9_.]+/)?[-A-Za-z0-9_.]+$'
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      npm_format:
        executable: npm
        args: ["run", "format"]
        defaultTimeoutSeconds: 1800
        maxTimeoutSeconds: 36000
      npm_lint_fix:
        executable: npm
        args: ["run", "lint", "--", "--fix"]
        defaultTimeoutSeconds: 1800
        maxTimeoutSeconds: 36000
      cargo_test:
        executable: cargo
        args: ["test"]
        defaultTimeoutSeconds: 6000
        maxTimeoutSeconds: 36000
      cargo_check:
        executable: cargo
        args: ["check"]
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      cargo_build:
        executable: cargo
        args: ["build"]
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      cargo_clippy:
        executable: cargo
        args: ["clippy", "--all-targets", "--all-features"]
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      cargo_fmt_check:
        executable: cargo
        args: ["fmt", "--check"]
        defaultTimeoutSeconds: 600
        maxTimeoutSeconds: 36000
      cargo_fetch:
        executable: cargo
        args: ["fetch"]
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      cargo_update:
        executable: cargo
        args: ["update"]
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      cargo_add:
        executable: cargo
        args: ["add"]
        allowExtraArgs: true
        maxExtraArgs: 20
        extraArgPattern: '^[A-Za-z0-9_-]+(?:@[A-Za-z0-9_.+~-]+)?$'
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      cargo_fmt:
        executable: cargo
        args: ["fmt"]
        defaultTimeoutSeconds: 600
        maxTimeoutSeconds: 36000
      go_test:
        executable: go
        args: ["test", "./..."]
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      go_build:
        executable: go
        args: ["build", "./..."]
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      go_vet:
        executable: go
        args: ["vet", "./..."]
        defaultTimeoutSeconds: 1800
        maxTimeoutSeconds: 36000
      go_fmt_check:
        executable: gofmt
        args: ["-l", "."]
        defaultTimeoutSeconds: 600
        maxTimeoutSeconds: 36000
        failOnStdout: true
      go_mod_download:
        executable: go
        args: ["mod", "download"]
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      go_mod_tidy:
        executable: go
        args: ["mod", "tidy"]
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      go_get:
        executable: go
        args: ["get"]
        allowExtraArgs: true
        maxExtraArgs: 20
        extraArgPattern: '^[A-Za-z0-9_.~+:/@-]+(?:/[A-Za-z0-9_.~+:/@-]+)*$'
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      go_fmt:
        executable: go
        args: ["fmt", "./..."]
        defaultTimeoutSeconds: 600
        maxTimeoutSeconds: 36000
      uv_sync:
        executable: uv
        args: ["sync"]
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      uv_add:
        executable: uv
        args: ["add"]
        allowExtraArgs: true
        maxExtraArgs: 20
        extraArgPattern: '^[A-Za-z0-9_.@/+~!<>=\[\],:-]+$'
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      uv_run_pytest:
        executable: uv
        args: ["run", "pytest"]
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      pip_install_requirements:
        executable: pip
        args: ["install", "-r", "requirements.txt"]
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000

tools:
  - name: context.get
    type: builtIn
    description: ChatGPT Web coding preflight. Call this first before reading files, inspecting Git, planning changes, applying changes, running tasks, or committing. Returns workspace context, project manifests, task availability, upstream health, current tool surface version, warnings, and recommended workflow.
    inputSchema: &emptyInputSchema
      type: object
      additionalProperties: false
    outputSchema: &genericObjectOutputSchema
      type: object
      additionalProperties: true
    annotations: &readOnlyAnnotations
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false

  - name: read.tree
    type: builtIn
    description: Return a bounded workspace file tree while skipping protected paths. Requires context.get first.
    inputSchema:
      type: object
      properties:
        path:
          type: string
        depth:
          type: integer
          minimum: 0
          maximum: 8
        maxEntries:
          type: integer
          minimum: 1
          maximum: 1000
      additionalProperties: false
    outputSchema: *genericObjectOutputSchema
    annotations: *readOnlyAnnotations

  - name: read.search
    type: builtIn
    description: Search workspace text files by literal query while skipping protected paths. Requires context.get first.
    inputSchema:
      type: object
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 500
        path:
          type: string
        glob:
          type: string
        maxResults:
          type: integer
          minimum: 1
          maximum: 200
        caseSensitive:
          type: boolean
      required: [query]
      additionalProperties: false
    outputSchema: *genericObjectOutputSchema
    annotations: *readOnlyAnnotations

  - name: read.files
    type: builtIn
    description: Read one or more workspace text files while enforcing protected paths and output limits. Requires context.get first.
    inputSchema:
      type: object
      properties:
        paths:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
      required: [paths]
      additionalProperties: false
    outputSchema: *genericObjectOutputSchema
    annotations: *readOnlyAnnotations

  - name: read.stat
    type: builtIn
    description: Return metadata for one workspace path while enforcing protected paths. Requires context.get first.
    inputSchema:
      type: object
      properties:
        path:
          type: string
      required: [path]
      additionalProperties: false
    outputSchema: *genericObjectOutputSchema
    annotations: *readOnlyAnnotations

  - name: change.plan
    type: builtIn
    description: Read-only planning tool for one complete batch workspace change. Validates proposed create/edit/replace/delete/mkdir operations, detects conflicts, and returns a diff. Requires context.get first.
    inputSchema: &changeInputSchema
      type: object
      properties:
        baseRevision:
          type: string
        changes:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              op:
                type: string
                enum: [create, replace, edit, delete, mkdir]
              path:
                type: string
              expectedSha256:
                type: string
              content:
                type: string
              edits:
                type: array
                minItems: 1
                items:
                  type: object
                  properties:
                    oldText:
                      type: string
                    newText:
                      type: string
                    replaceAll:
                      type: boolean
                  required: [oldText, newText]
                  additionalProperties: false
            required: [op, path]
            additionalProperties: false
      required: [changes]
      additionalProperties: false
    outputSchema: *genericObjectOutputSchema
    annotations: *readOnlyAnnotations
    _meta:
      "openai/toolInvocation/invoking": "Planning change"
      "openai/toolInvocation/invoked": "Change planned"

  - name: change.prepare
    type: builtIn
    description: Prepare one complete batch workspace change for a later write attempt and for a generic manual completion gate if ChatGPT Web blocks the write. It validates the same create/edit/replace/delete/mkdir changeset as change.plan, records an expiring prepared action, may create generic review artifacts, and does not mutate the workspace. Call this before change.apply.
    inputSchema: *changeInputSchema
    outputSchema:
      type: object
      properties:
        status:
          type: string
          enum: [prepared, conflicted]
        valid:
          type: boolean
        preparedId:
          type: string
        operationId:
          type: string
        manualGate:
          type: ["object", "null"]
          properties:
            preparedId:
              type: string
            reason:
              type: string
              enum: [manual_review_requested]
            expiresAt:
              type: string
            nextTool:
              type: string
              enum: [manual.gate]
            artifacts:
              type: array
              items:
                type: object
                additionalProperties: true
            checks:
              type: array
              items:
                type: object
                additionalProperties: true
          required: [preparedId, reason, expiresAt, nextTool]
          additionalProperties: true
      required: [status, valid, summary, files, diff, conflicts, manualGate]
      additionalProperties: true
    annotations: *readOnlyAnnotations
    _meta:
      "openai/toolInvocation/invoking": "Preparing change"
      "openai/toolInvocation/invoked": "Change prepared"

  - name: manual.gate
    type: builtIn
    description: >-
      Open a manual barrier that waits for the user to complete a step outside
      ChatGPT and then continue in a later message that starts with /resume.
      This tool does not apply patches, delete files, run commands, or mutate
      the workspace. Before calling this tool, ChatGPT Web must show detailed
      manual instructions in chat: for commands, include the complete command
      and redirect stdout/stderr to a workspace-relative temporary log file; for
      prepared diffs, show small diffs inline or link large review artifacts
      from change.prepare. Use this after an OpenAI safety block or whenever
      the user must manually complete something before the model continues.
      After this tool returns awaiting_manual_completion, stop the assistant
      turn immediately even if other tasks remain, and wait for a later user
      message that starts with /resume. If ChatGPT Web blocks this manual.gate
      call with OpenAI safety checks, stop immediately and wait for human
      intervention; do not try another tool or workaround. While pending,
      webvibe blocks other tools with
      MANUAL_PENDING_REQUIRED.
    inputSchema:
      type: object
      properties:
        preparedId:
          type: string
        reason:
          type: string
          enum:
            - openai_safety_block
            - host_confirmation_block
            - manual_review_requested
            - external_manual_step
            - user_requested_manual_step
        hostObservation:
          type: object
          properties:
            toolName:
              type: string
            outputText:
              type: string
              maxLength: 4000
          additionalProperties: false
      required: [reason]
      additionalProperties: false
    outputSchema:
      type: object
      properties:
        status:
          type: string
          enum: [awaiting_manual_completion]
        operationId:
          type: string
        pendingId:
          type: string
        preparedId:
          type: string
        reason:
          type: string
          enum:
            - openai_safety_block
            - host_confirmation_block
            - manual_review_requested
            - external_manual_step
            - user_requested_manual_step
        expiresAt:
          type: string
        resumeTool:
          type: string
          enum: [manual.resume]
        continuation:
          type: object
          properties:
            mode:
              type: string
              enum: [await_resume_command]
            modelShouldStop:
              type: boolean
            mustEndTurn:
              type: boolean
            resumeMode:
              type: string
              enum: [resume_interrupted_workflow]
          required: [mode, modelShouldStop, mustEndTurn, resumeMode]
          additionalProperties: false
      required: [status, operationId, pendingId, reason, expiresAt, resumeTool, continuation]
      additionalProperties: false
    annotations:
      readOnlyHint: false
      destructiveHint: false
      openWorldHint: false
    _meta:
      "openai/toolInvocation/invoking": "Opening manual gate"
      "openai/toolInvocation/invoked": "Manual gate opened"

  - name: manual.resume
    type: builtIn
    description: manual.resume is the authoritative transition from a pending manual action to confirmed/cancelled/expired. It does not apply patches, delete files, run commands, or mutate the workspace. Call it only after a later user message starts with /resume. It validates the resume command with trimStart() and exact lowercase /resume, accepts /resume cancel, treats any other /resume tail as an optional workspace-relative manual log file path, optionally verifies configured post-completion checks, writes an audit event, and lets tools continue only after the pending action is resolved.
    inputSchema:
      type: object
      properties:
        resumeMessage:
          type: string
          minLength: 1
          maxLength: 2000
      required: [resumeMessage]
      additionalProperties: false
    outputSchema:
      type: object
      properties:
        status:
          type: string
          enum: [confirmed, cancelled, verification_failed, expired, not_found, blocked]
        code:
          type: string
          enum: [RESUME_COMMAND_REQUIRED]
        operationId:
          type: string
        pendingId:
          type: string
        preparedId:
          type: string
        reason:
          type: string
        outcome:
          type: string
          enum: [completed, cancelled]
        verification:
          type: object
          additionalProperties: true
        next:
          type: object
          properties:
            recommendedTools:
              type: array
              items:
                type: string
            mode:
              type: string
              enum: [await_resume_command, resume_interrupted_workflow]
            verifyBeforeContinuing:
              type: boolean
            followUpPrompt:
              type: string
          required: [recommendedTools, mode, verifyBeforeContinuing, followUpPrompt]
          additionalProperties: false
      required: [status, verification, next]
      additionalProperties: false
    annotations:
      readOnlyHint: false
      destructiveHint: false
      openWorldHint: false
    _meta:
      "openai/toolInvocation/invoking": "Resuming manual action"
      "openai/toolInvocation/invoked": "Manual action resumed"

  - name: change.apply
    type: builtIn
    description: Apply one complete batch workspace change in a single write approval. Use one call for the full user-requested file change; do not split a single request across multiple write calls. Call change.prepare first so a generic manual completion gate is available if ChatGPT Web blocks this write. If ChatGPT Web asks for confirmation, retry this same tool once with the identical JSON arguments. If ChatGPT Web returns "This tool call was blocked by OpenAI's safety checks. Please double check what you are sending.", stop using write tools and call manual.gate with the latest preparedId. Do not transform, split, encode, hide, or rewrite the changeset to bypass the block. Requires context.get first.
    inputSchema: *changeInputSchema
    outputSchema: *genericObjectOutputSchema
    annotations:
      readOnlyHint: false
      destructiveHint: true
      openWorldHint: false
    _meta:
      "openai/toolInvocation/invoking": "Applying change"
      "openai/toolInvocation/invoked": "Change applied"

  - name: task.run
    type: builtIn
    description: >-
      Run one preconfigured local task by taskId, optionally from a
      workspace-relative cwd. Does not accept arbitrary shell commands.
      Available taskIds, cwd support, argument rules, and availability are
      returned by context.get. If the task is unavailable and manualRequired is
      returned, show its userInstructions in ChatGPT Web, then call manual.gate
      only with reason and hostObservation gate fields so the user can run the
      task manually and reply later with /resume and an optional
      workspace-relative log file path.
      Requires context.get first.
    inputSchema:
      type: object
      properties:
        taskId:
          type: string
          minLength: 1
          maxLength: 100
        timeoutSeconds:
          type: integer
          minimum: 1
          maximum: 36000
        extraArgs:
          type: array
          maxItems: 20
          items:
            type: string
        cwd:
          type: string
          minLength: 1
          maxLength: 500
      required: [taskId]
      additionalProperties: false
    outputSchema:
      type: object
      properties:
        status:
          type: string
          enum: [ok, failed, timeout, unavailable]
        taskId:
          type: string
        exitCode:
          type: ["integer", "null"]
        stdout:
          type: string
        stderr:
          type: string
        durationMs:
          type: integer
        timeoutSeconds:
          type: integer
        unavailableReason:
          type: string
        manualRequired:
          type: object
          properties:
            nextTool:
              type: string
              enum: [manual.gate]
            reason:
              type: string
              enum: [external_manual_step]
            userInstructions:
              type: string
            hostObservation:
              type: object
              properties:
                toolName:
                  type: string
                outputText:
                  type: string
              required: [toolName, outputText]
              additionalProperties: false
          required: [nextTool, reason, userInstructions, hostObservation]
          additionalProperties: false
      required: [status, taskId, exitCode, stdout, stderr, durationMs, timeoutSeconds]
      additionalProperties: false
    annotations:
      readOnlyHint: false
      destructiveHint: true
      openWorldHint: false

  - name: git.status
    type: builtIn
    description: Show concise Git worktree status. Requires context.get first.
    inputSchema: *emptyInputSchema
    outputSchema: &gitOutputSchema
      type: object
      properties:
        status:
          type: string
          enum: [ok, failed, timeout, unavailable]
        command:
          type: string
        exitCode:
          type: ["integer", "null"]
        stdout:
          type: string
        stderr:
          type: string
        durationMs:
          type: integer
        unavailableReason:
          type: string
      required: [status, command, exitCode, stdout, stderr, durationMs]
      additionalProperties: false
    annotations: *readOnlyAnnotations

  - name: git.diff
    type: builtIn
    description: Show staged or unstaged Git diff for the workspace or one path. Requires context.get first.
    inputSchema:
      type: object
      properties:
        scope:
          type: string
          enum: [unstaged, staged]
        path:
          type: string
      additionalProperties: false
    outputSchema: *gitOutputSchema
    annotations: *readOnlyAnnotations

  - name: git.history
    type: builtIn
    description: Show recent Git history. Requires context.get first.
    inputSchema:
      type: object
      properties:
        maxCount:
          type: integer
          minimum: 1
          maximum: 200
      additionalProperties: false
    outputSchema: *gitOutputSchema
    annotations: *readOnlyAnnotations

  - name: git.show
    type: builtIn
    description: Show one Git revision with stat and patch, optionally scoped to a path. Requires context.get first.
    inputSchema:
      type: object
      properties:
        revision:
          type: string
          minLength: 1
          maxLength: 200
        path:
          type: string
      additionalProperties: false
    outputSchema: *gitOutputSchema
    annotations: *readOnlyAnnotations

  - name: git.commit
    type: builtIn
    description: Commit only explicit workspace-relative paths with the provided message; protected paths are rejected and unrelated dirty files are not included. Requires context.get first.
    inputSchema:
      type: object
      properties:
        paths:
          type: array
          minItems: 1
          maxItems: 80
          items:
            type: string
        message:
          type: string
          minLength: 1
          maxLength: 500
      required: [paths, message]
      additionalProperties: false
    outputSchema: *gitOutputSchema
    annotations:
      readOnlyHint: false
      destructiveHint: true
      openWorldHint: false

  - name: diagnostics.health
    type: builtIn
    description: Return webvibe relay diagnostics, tool surface version, hashes, and upstream health. This is for connector diagnostics, not the ChatGPT Web coding preflight.
    inputSchema: *emptyInputSchema
    outputSchema: *genericObjectOutputSchema
    annotations: *readOnlyAnnotations

limits:
  maxToolOutputBytes: 60000
  timeoutMs: 30000

audit:
  enabled: true
  maxLogBytes: 10485760
  payloads: full-redacted
  includeClientVisibleOutput: true
  includeRawToolOutput: true
  includeErrors: true
  includeErrorStack: true
  includeManualEvents: true
  redact: true
