    inputSchema: &packageTaskInputSchema
      type: object
      properties:
        packages:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 200
        timeoutSeconds:
          type: integer
          minimum: 1
          maximum: 36000
      required: [packages]
      additionalProperties: false
    outputSchema: *taskOutputSchema
    timeoutSeconds:
      default: 3000
      maximum: 36000
