version: 2
mode: dev
profile: chatgptWebDefault

profiles:
  chatgptWebDefault:
    limits:
      output:
        preferredToolOutputBytes: 12000
        maxToolOutputBytes: 60000
      http:
        oauthMaxBodyBytes: 1048576
        mcpMaxBodyBytes: 16777216
      tree:
        defaultMaxEntries: 300
        maxEntries: 5000
        maxDepth: 12
      search:
        engine: rg
        defaultMaxResults: 80
        maxResults: 1000
        maxColumns: 300
        maxContextLines: 5
        maxScannedBytesPerFile: null
      read:
        defaultMaxBytes: 12000
        maxBytes: 131072
        maxReadManyFiles: 50
      change:
        maxFiles: 1000
        defaultMaxFiles: 200
        maxTotalBytes: 16777216
        maxTextFileBytes: 2097152
        maxInlineDiffBytes: 12288
        maxInlineDiffLines: 200
      task:
        defaultTimeoutSeconds: 300
        maxTimeoutSeconds: 3600
        outputHeadBytes: 12000
        outputTailBytes: 12000
      manual:
        ttlSeconds: 86400
        manualMessageMaxBytes: 65536
      rate:
        maxCallsPerMinute: 120

workspace:
  root: "${workspaceRoot}"
  protected:
    - ".git/**"
    - ".env"
    - "**/.env"
    - "**/*.pem"
    - "**/id_rsa"
    - "**/id_ed25519"
    - "node_modules/**"
    - "dist/**"
    - "build/**"

upstreams:
  tasks:
    transport: local-task-runner
    cwd: "${workspaceRoot}"
    tasks:
      npm_test:
        executable: npm
        args: ["test"]
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      npm_build:
        executable: npm
        args: ["run", "build", "--if-present"]
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      npm_lint:
        executable: npm
        args: ["run", "lint", "--if-present"]
        defaultTimeoutSeconds: 1800
        maxTimeoutSeconds: 36000
      npm_typecheck:
        executable: npm
        args: ["run", "typecheck", "--if-present"]
        defaultTimeoutSeconds: 1800
        maxTimeoutSeconds: 36000
      npm_start:
        executable: npm
        args: ["start"]
        defaultTimeoutSeconds: 300
        maxTimeoutSeconds: 36000
      npm_install:
        executable: npm
        args: ["install"]
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      npm_ci:
        executable: npm
        args: ["ci"]
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      npm_add_package:
        executable: npm
        args: ["install"]
        allowExtraArgs: true
        maxExtraArgs: 21
        allowedExtraArgs: ["--save-dev"]
        extraArgPattern: '^(?:@[-A-Za-z0-9_.]+/)?[-A-Za-z0-9_.]+(?:@[-A-Za-z0-9_.*~^<>!=+:/]+)?$'
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      npm_remove_package:
        executable: npm
        args: ["uninstall"]
        allowExtraArgs: true
        maxExtraArgs: 20
        extraArgPattern: '^(?:@[-A-Za-z0-9_.]+/)?[-A-Za-z0-9_.]+$'
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      npm_format:
        executable: npm
        args: ["run", "format"]
        defaultTimeoutSeconds: 1800
        maxTimeoutSeconds: 36000
      npm_lint_fix:
        executable: npm
        args: ["run", "lint", "--", "--fix"]
        defaultTimeoutSeconds: 1800
        maxTimeoutSeconds: 36000
      cargo_test:
        executable: cargo
        args: ["test"]
        defaultTimeoutSeconds: 6000
        maxTimeoutSeconds: 36000
      cargo_check:
        executable: cargo
        args: ["check"]
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      cargo_build:
        executable: cargo
        args: ["build"]
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      cargo_clippy:
        executable: cargo
        args: ["clippy", "--all-targets", "--all-features"]
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      cargo_fmt_check:
        executable: cargo
        args: ["fmt", "--check"]
        defaultTimeoutSeconds: 600
        maxTimeoutSeconds: 36000
      cargo_fetch:
        executable: cargo
        args: ["fetch"]
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      cargo_update:
        executable: cargo
        args: ["update"]
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      cargo_add:
        executable: cargo
        args: ["add"]
        allowExtraArgs: true
        maxExtraArgs: 20
        extraArgPattern: '^[A-Za-z0-9_-]+(?:@[A-Za-z0-9_.+~-]+)?$'
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      cargo_fmt:
        executable: cargo
        args: ["fmt"]
        defaultTimeoutSeconds: 600
        maxTimeoutSeconds: 36000
      go_test:
        executable: go
        args: ["test", "./..."]
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      go_build:
        executable: go
        args: ["build", "./..."]
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      go_vet:
        executable: go
        args: ["vet", "./..."]
        defaultTimeoutSeconds: 1800
        maxTimeoutSeconds: 36000
      go_fmt_check:
        executable: gofmt
        args: ["-l", "."]
        defaultTimeoutSeconds: 600
        maxTimeoutSeconds: 36000
        failOnStdout: true
      go_mod_download:
        executable: go
        args: ["mod", "download"]
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      go_mod_tidy:
        executable: go
        args: ["mod", "tidy"]
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      go_get:
        executable: go
        args: ["get"]
        allowExtraArgs: true
        maxExtraArgs: 20
        extraArgPattern: '^[A-Za-z0-9_.~+:/@-]+(?:/[A-Za-z0-9_.~+:/@-]+)*$'
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      go_fmt:
        executable: go
        args: ["fmt", "./..."]
        defaultTimeoutSeconds: 600
        maxTimeoutSeconds: 36000
      uv_sync:
        executable: uv
        args: ["sync"]
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      uv_add:
        executable: uv
        args: ["add"]
        allowExtraArgs: true
        maxExtraArgs: 20
        extraArgPattern: '^[A-Za-z0-9_.@/+~!<>=\[\],:-]+$'
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      uv_run_pytest:
        executable: uv
        args: ["run", "pytest"]
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000
      pip_install_requirements:
        executable: pip
        args: ["install", "-r", "requirements.txt"]
        defaultTimeoutSeconds: 3000
        maxTimeoutSeconds: 36000

tools:
  - name: workspace.context
    type: builtIn
    description: Preflight context for ChatGPT Web coding. Call before workspace tools.
    inputSchema: &emptyInputSchema
      type: object
      additionalProperties: false
    outputSchema: &genericObjectOutputSchema
      type: object
      additionalProperties: true
    annotations: &readOnlyAnnotations
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false

  - name: workspace.scan
    type: builtIn
    description: Deep workspace scan for project manifests, languages, tools, task files, and codegen.
    inputSchema:
      type: object
      properties:
        maxDepth:
          type: integer
          minimum: 0
          maximum: 12
      additionalProperties: false
    outputSchema: *genericObjectOutputSchema
    annotations: *readOnlyAnnotations

  - name: workspace.symbols
    type: builtIn
    description: Query workspace symbol map. Returns unavailable until symbol support is enabled.
    inputSchema:
      type: object
      properties:
        query:
          type: string
        path:
          type: string
        kind:
          type: string
        cursor:
          type: string
        maxResults:
          type: integer
          minimum: 1
          maximum: 1000
      additionalProperties: false
    outputSchema: *genericObjectOutputSchema
    annotations: *readOnlyAnnotations

  - name: fs.tree
    type: builtIn
    description: Return a bounded workspace file tree while skipping protected paths.
    inputSchema:
      type: object
      properties:
        path:
          type: string
        mode:
          type: string
          enum: [files, dirs, packages, git-tracked, all]
        include:
          type: array
          items:
            type: string
        exclude:
          type: array
          items:
            type: string
        respectGitignore:
          type: boolean
        includeHidden:
          type: boolean
        includeIgnored:
          type: boolean
        depth:
          type: integer
          minimum: 0
          maximum: 12
        maxEntries:
          type: integer
          minimum: 1
          maximum: 5000
        cursor:
          type: string
      additionalProperties: false
    outputSchema: *genericObjectOutputSchema
    annotations: *readOnlyAnnotations

  - name: fs.search
    type: builtIn
    description: Search workspace text while skipping protected paths.
    inputSchema:
      type: object
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 500
        mode:
          type: string
          enum: [regex, fixed]
        path:
          type: string
        include:
          type: array
          items:
            type: string
        exclude:
          type: array
          items:
            type: string
        case:
          type: string
          enum: [smart, sensitive, insensitive]
        contextLines:
          type: integer
          minimum: 0
          maximum: 5
        maxResults:
          type: integer
          minimum: 1
          maximum: 1000
        maxColumns:
          type: integer
          minimum: 1
          maximum: 300
      required: [query]
      additionalProperties: false
    outputSchema: *genericObjectOutputSchema
    annotations: *readOnlyAnnotations

  - name: fs.read
    type: builtIn
    description: Read one workspace file in a bounded UTF-8 byte chunk.
    inputSchema:
      type: object
      properties:
        path:
          type: string
        byteOffset:
          type: integer
          minimum: 0
        range:
          type: object
          properties:
            startLine:
              type: integer
              minimum: 1
            endLine:
              type: integer
              minimum: 1
          required: [startLine, endLine]
          additionalProperties: false
        maxBytes:
          type: integer
          minimum: 1
          maximum: 131072
      required: [path]
      additionalProperties: false
    outputSchema: *genericObjectOutputSchema
    annotations: *readOnlyAnnotations

  - name: fs.read_many
    type: builtIn
    description: Read multiple workspace files in bounded UTF-8 byte chunks.
    inputSchema:
      type: object
      properties:
        files:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            properties:
              path:
                type: string
              byteOffset:
                type: integer
                minimum: 0
              maxBytes:
                type: integer
                minimum: 1
                maximum: 131072
              range:
                type: object
                properties:
                  startLine:
                    type: integer
                    minimum: 1
                  endLine:
                    type: integer
                    minimum: 1
                required: [startLine, endLine]
                additionalProperties: false
            required: [path]
            additionalProperties: false
        maxBytesPerFile:
          type: integer
          minimum: 1
          maximum: 131072
      required: [files]
      additionalProperties: false
    outputSchema: *genericObjectOutputSchema
    annotations: *readOnlyAnnotations

  - name: fs.stat
    type: builtIn
    description: Return metadata for one workspace path.
    inputSchema:
      type: object
      properties:
        path:
          type: string
        paths:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: string
      additionalProperties: false
    outputSchema: *genericObjectOutputSchema
    annotations: *readOnlyAnnotations

  - name: fs.manifest
    type: builtIn
    description: Return manifest entries with hashes for workspace paths.
    inputSchema:
      type: object
      properties:
        paths:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: string
      required: [paths]
      additionalProperties: false
    outputSchema: *genericObjectOutputSchema
    annotations: *readOnlyAnnotations

  - name: change.preview
    type: builtIn
    description: Validate and diff one complete batch workspace change.
    inputSchema: &changeInputSchema
      type: object
      properties:
        baseRevision:
          type: string
        previewHash:
          type: string
        changes:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              op:
                type: string
                enum: [write, replace, text_edit, json_patch, unified_diff, rename, create, edit, delete, mkdir]
              path:
                type: string
              from:
                type: string
              to:
                type: string
              expectedSha256:
                type: string
              content:
                type: string
              edits:
                type: array
                minItems: 1
                items:
                  type: object
                  properties:
                    oldText:
                      type: string
                    newText:
                      type: string
                    replaceAll:
                      type: boolean
                  required: [oldText, newText]
                  additionalProperties: false
              patch:
                type: array
                minItems: 1
                items:
                  type: object
                  properties:
                    op:
                      type: string
                      enum: [add, replace, remove]
                    path:
                      type: string
                    value: true
                  required: [op, path]
                  additionalProperties: false
              diff:
                type: string
            required: [op]
            additionalProperties: false
      required: [changes]
      additionalProperties: false
    outputSchema: *genericObjectOutputSchema
    annotations: *readOnlyAnnotations

  - name: manual.gate
    type: builtIn
    description: Open a manual barrier after manual instructions were shown in chat.
    inputSchema:
      type: object
      properties:
        preparedId:
          type: string
        reason:
          type: string
          enum:
            - openai_safety_block
            - manual_review_requested
            - external_manual_step
        hostObservation:
          type: object
          properties:
            toolName:
              type: string
            outputText:
              type: string
              maxLength: 4000
          additionalProperties: false
      required: [reason]
      additionalProperties: false
    outputSchema:
      type: object
      properties:
        status:
          type: string
          enum: [awaiting_manual_completion]
        operationId:
          type: string
        pendingId:
          type: string
        preparedId:
          type: string
        reason:
          type: string
          enum:
            - openai_safety_block
            - manual_review_requested
            - external_manual_step
        expiresAt:
          type: string
        resumeTool:
          type: string
          enum: [manual.resume]
        continuation:
          type: object
          properties:
            mode:
              type: string
              enum: [await_resume_command]
            modelShouldStop:
              type: boolean
            mustEndTurn:
              type: boolean
            resumeMode:
              type: string
              enum: [resume_interrupted_workflow]
          required: [mode, modelShouldStop, mustEndTurn, resumeMode]
          additionalProperties: false
      required: [status, operationId, pendingId, reason, expiresAt, resumeTool, continuation]
      additionalProperties: false
    annotations:
      readOnlyHint: false
      destructiveHint: false
      openWorldHint: false
    _meta:
      "openai/toolInvocation/invoking": "Opening manual gate"
      "openai/toolInvocation/invoked": "Manual gate opened"

  - name: manual.resume
    type: builtIn
    description: manual.resume is the authoritative transition from a pending manual action to confirmed/cancelled/expired. It does not apply patches, delete files, run commands, or mutate the workspace. Call it only after a later user message starts with /resume. It validates the resume command with trimStart() and exact lowercase /resume, accepts /resume cancel, treats any other /resume tail as an optional workspace-relative manual log file path, optionally verifies configured post-completion checks, writes an audit event, and lets tools continue only after the pending action is resolved.
    inputSchema:
      type: object
      properties:
        resumeMessage:
          type: string
          minLength: 1
          maxLength: 2000
      required: [resumeMessage]
      additionalProperties: false
    outputSchema:
      type: object
      properties:
        status:
          type: string
          enum: [confirmed, cancelled, verification_failed, expired, not_found, blocked]
        code:
          type: string
          enum: [RESUME_COMMAND_REQUIRED]
        operationId:
          type: string
        pendingId:
          type: string
        preparedId:
          type: string
        reason:
          type: string
        outcome:
          type: string
          enum: [completed, cancelled]
        verification:
          type: object
          additionalProperties: true
        next:
          type: object
          properties:
            recommendedTools:
              type: array
              items:
                type: string
            mode:
              type: string
              enum: [await_resume_command, resume_interrupted_workflow]
            verifyBeforeContinuing:
              type: boolean
            followUpPrompt:
              type: string
          required: [recommendedTools, mode, verifyBeforeContinuing, followUpPrompt]
          additionalProperties: false
      required: [status, verification, next]
      additionalProperties: false
    annotations:
      readOnlyHint: false
      destructiveHint: false
      openWorldHint: false
    _meta:
      "openai/toolInvocation/invoking": "Resuming manual action"
      "openai/toolInvocation/invoked": "Manual action resumed"

  - name: change.apply
    type: builtIn
    description: Apply one complete batch workspace change after preview.
    inputSchema: *changeInputSchema
    outputSchema: *genericObjectOutputSchema
    annotations:
      readOnlyHint: false
      destructiveHint: true
      openWorldHint: false
    _meta:
      "openai/toolInvocation/invoking": "Applying change"
      "openai/toolInvocation/invoked": "Change applied"

  - name: task.list
    type: builtIn
    description: List available and unavailable policy-defined tasks.
    inputSchema: *emptyInputSchema
    outputSchema: *genericObjectOutputSchema
    annotations: *readOnlyAnnotations

  - name: task.run
    type: builtIn
    description: Run one policy-defined local task by taskId. Does not accept arbitrary shell.
    inputSchema:
      type: object
      properties:
        taskId:
          type: string
          minLength: 1
          maxLength: 100
        timeoutSeconds:
          type: integer
          minimum: 1
          maximum: 36000
        extraArgs:
          type: array
          maxItems: 20
          items:
            type: string
        cwd:
          type: string
          minLength: 1
          maxLength: 500
        mode:
          type: string
          enum: [foreground, background]
      required: [taskId]
      additionalProperties: false
    outputSchema:
      type: object
      properties:
        status:
          type: string
          enum: [running, ok, failed, timeout, unavailable]
        taskId:
          type: string
        runId:
          type: string
        exitCode:
          type: ["integer", "null"]
        stdout: &taskOutputSummarySchema
          type: object
          properties:
            head:
              type: string
            tail:
              type: string
            truncated:
              type: boolean
            sha256:
              type: string
            bytes:
              type: integer
            logPath:
              type: string
          required: [head, tail, truncated, sha256, bytes, logPath]
          additionalProperties: false
        stderr: *taskOutputSummarySchema
        durationMs:
          type: integer
        timeoutSeconds:
          type: integer
        unavailableReason:
          type: string
        manualRequired:
          type: object
          properties:
            nextTool:
              type: string
              enum: [manual.gate]
            reason:
              type: string
              enum: [external_manual_step]
            userInstructions:
              type: string
            hostObservation:
              type: object
              properties:
                toolName:
                  type: string
                outputText:
                  type: string
              required: [toolName, outputText]
              additionalProperties: false
          required: [nextTool, reason, userInstructions, hostObservation]
          additionalProperties: false
      required: [status, runId, taskId, exitCode, stdout, stderr, durationMs, timeoutSeconds]
      additionalProperties: false
    annotations:
      readOnlyHint: false
      destructiveHint: true
      openWorldHint: false

  - name: task.result
    type: builtIn
    description: Read task run status and log summaries by runId.
    inputSchema:
      type: object
      properties:
        runId:
          type: string
      required: [runId]
      additionalProperties: false
    outputSchema: *genericObjectOutputSchema
    annotations: *readOnlyAnnotations

  - name: git.status
    type: builtIn
    description: Show concise Git worktree status.
    inputSchema: *emptyInputSchema
    outputSchema: &gitOutputSchema
      type: object
      properties:
        status:
          type: string
          enum: [ok, failed, timeout, unavailable]
        command:
          type: string
        exitCode:
          type: ["integer", "null"]
        stdout:
          type: string
        stderr:
          type: string
        durationMs:
          type: integer
        unavailableReason:
          type: string
      required: [status, command, exitCode, stdout, stderr, durationMs]
      additionalProperties: false
    annotations: *readOnlyAnnotations

  - name: git.changed
    type: builtIn
    description: Show changed files.
    inputSchema: *emptyInputSchema
    outputSchema: *gitOutputSchema
    annotations: *readOnlyAnnotations

  - name: git.diff
    type: builtIn
    description: Show staged or unstaged Git diff for the workspace or one path.
    inputSchema:
      type: object
      properties:
        scope:
          type: string
          enum: [unstaged, staged]
        path:
          type: string
        maxBytes:
          type: integer
          minimum: 1
          maximum: 60000
        cursor:
          type: string
      additionalProperties: false
    outputSchema: *gitOutputSchema
    annotations: *readOnlyAnnotations

  - name: git.show
    type: builtIn
    description: Show one Git revision with stat and patch.
    inputSchema:
      type: object
      properties:
        revision:
          type: string
          minLength: 1
          maxLength: 200
        path:
          type: string
        maxBytes:
          type: integer
          minimum: 1
          maximum: 60000
        cursor:
          type: string
      additionalProperties: false
    outputSchema: *gitOutputSchema
    annotations: *readOnlyAnnotations

  - name: git.blame
    type: builtIn
    description: Show line blame. Returns unavailable until blame support is enabled.
    inputSchema:
      type: object
      properties:
        path:
          type: string
        startLine:
          type: integer
          minimum: 1
        endLine:
          type: integer
          minimum: 1
      required: [path]
      additionalProperties: false
    outputSchema: *genericObjectOutputSchema
    annotations: *readOnlyAnnotations

  - name: git.commit_preview
    type: builtIn
    description: Preview an explicit-path commit. Returns unavailable until commit preview support is enabled.
    inputSchema:
      type: object
      properties:
        paths:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: string
      required: [paths]
      additionalProperties: false
    outputSchema: *genericObjectOutputSchema
    annotations: *readOnlyAnnotations

  - name: git.commit
    type: builtIn
    description: Commit only explicit workspace-relative paths with the provided message.
    inputSchema:
      type: object
      properties:
        paths:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: string
        message:
          type: string
          minLength: 1
          maxLength: 500
        previewHash:
          type: string
      required: [paths, message, previewHash]
      additionalProperties: false
    outputSchema: *gitOutputSchema
    annotations:
      readOnlyHint: false
      destructiveHint: true
      openWorldHint: false

  - name: diagnostics.health
    type: builtIn
    description: Return webvibe relay diagnostics, tool surface version, hashes, and upstream health. This is for connector diagnostics, not the ChatGPT Web coding preflight.
    inputSchema: *emptyInputSchema
    outputSchema: *genericObjectOutputSchema
    annotations: *readOnlyAnnotations

audit:
  enabled: true
  maxLogBytes: 10485760
  payloads: full-redacted
  includeClientVisibleOutput: true
  includeRawToolOutput: true
  includeErrors: true
  includeErrorStack: true
  includeManualEvents: true
  redact: true
